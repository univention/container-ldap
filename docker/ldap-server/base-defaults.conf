# UCR defaults layer for the LDAP server container.
#
# ucr-light-filter reads base-defaults.conf, then base.conf, then
# base-forced.conf, and later files win, so every value here is a floor
# that a deployment can override from base.conf.
#
# Only keys whose correct value follows from how this image is built
# belong here. Deployment identity (ldap/base, domainname, hostname,
# server/role), replication topology and TLS paths stay in base.conf.
#
# In production stack-data owns base-defaults.conf and the chart mounts
# it over this file. This is the floor for the compose test setups.
#
# Keep colons out of comments. ucr-light-filter reads every line
# containing one as a key/value pair.

# The k5pwd overlay opens a kadm5 context when the backend starts and
# needs a krb5 realm for the local host. This image ships no krb5.conf
# and there is no KDC to keep krb5Key in sync with.
ldap/k5pwd: false
