{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
---
apiVersion: "monitoring.coreos.com/v1"
kind: "PodMonitor"
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" ( merge ( deepCopy .Values.metrics.podMonitor.labels ) .Values.additionalLabels ) "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
spec:
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: "metrics"
      path: "/metrics"
      {{- with .Values.metrics.podMonitor.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . | quote }}
      {{- end }}
      # The labels the LDAP dashboard selects on.
      relabelings:
        - targetLabel: "job"
          replacement: "slapd-exporter"
        - sourceLabels: ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          targetLabel: "cluster"
        - sourceLabels: ["__meta_kubernetes_pod_label_ldap_server_type"]
          targetLabel: "role"
{{- end }}
